<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | SlotSpot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html"><span class="mark" aria-hidden="true"></span>SlotSpot</a>
    <nav aria-label="Main">
      <a href="index.html">Find</a>
      <a href="my-bookings.html">My bookings</a>
      <a href="owner.html" id="owner-link" hidden>Owner</a>
      <a href="login.html" id="auth-link" aria-current="page">Log in</a>
    </nav>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>Log in or create an account</h1>
      <p class="muted">Customers log in to book. Business owners log in to manage their schedule.</p>
    </div>

    <div class="auth">
      <section class="panel">
        <h2>Log in</h2>
        <form id="login-form">
          <label>Email
            <input id="login-email" type="email" autocomplete="email" required>
          </label>
          <label>Password
            <input id="login-password" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit">Log in</button>
        </form>
        <div id="login-msg" class="msg"></div>
      </section>

      <section class="panel">
        <h2>Create an account</h2>
        <form id="register-form">
          <label>Name
            <input id="reg-name" type="text" maxlength="100" autocomplete="name" required>
          </label>
          <label>Email
            <input id="reg-email" type="email" autocomplete="email" required>
          </label>
          <label>Password (at least 8 characters)
            <input id="reg-password" type="password" minlength="8" autocomplete="new-password" required>
          </label>
          <button type="submit" class="secondary">Create account</button>
        </form>
        <div id="register-msg" class="msg"></div>
      </section>
    </div>
  </main>

  <script src="vendor/jquery.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
